spring.application.name=taskflow
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USERNAME:taskflow}
spring.datasource.password=${DB_PASSWORD:taskflow}

# Local development only. Production should use Flyway or Liquibase migrations
# instead of Hibernate ddl-auto schema management.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

taskflow.scheduler.enabled=true
taskflow.scheduler.fixed-delay=1000
taskflow.http.connect-timeout=2s
taskflow.http.read-timeout=5s
