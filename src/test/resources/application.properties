spring.datasource.url=jdbc:h2:mem:taskflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
taskflow.scheduler.enabled=false
taskflow.scheduler.fixed-delay=1000
taskflow.http.connect-timeout=1s
taskflow.http.read-timeout=2s
